<mat-sidenav-container class="h-full bg-primary mx-2 rounded-3xl">
	<mat-sidenav mode="side" opened>
		<mat-nav-list class="items-center w-full h-full flex flex-col">
			@for (navItem of menuItems(); track navItem){
				<button matFab class="bg-accent flex w-2/3 m-2">
				{{ navItem }}
				</button>
			}
		</mat-nav-list>
	</mat-sidenav>
</mat-sidenav-container>
