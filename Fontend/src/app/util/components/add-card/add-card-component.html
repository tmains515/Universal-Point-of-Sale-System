<mat-card class="card" appearance="outlined">
	<mat-card-header class="card__header">
		<mat-card-title class="card__title">New Store</mat-card-title>
	</mat-card-header>

	<mat-card-content class="card__content">
		<button
			mat-icon-button
			type="button"
			class="card__add"
			aria-label="Add a new store"
		>
			<mat-icon>add_circle</mat-icon>
		</button>
	</mat-card-content>
</mat-card>
