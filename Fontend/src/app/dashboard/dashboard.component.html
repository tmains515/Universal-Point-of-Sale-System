
<div class="dashboard">
	<div class="dashboard__panel">
		<mat-tab-group>
			<mat-tab label="Stores">
				<div class="content">
					@for (store of stores(); track store.id){
						<mat-card class="store_card" appearance="outlined">
							<mat-card-content >
								<mat-card-title> {{ store.storeName }} </mat-card-title>
							</mat-card-content>
						</mat-card>
					}
					<add-card-component/>
				</div>
			</mat-tab>
			<mat-tab label="Finance">Finance</mat-tab>
			<mat-tab label="POS Configurations">Configs</mat-tab>
			<mat-tab label="Inventory">Inventory</mat-tab>
		</mat-tab-group>
	</div>
</div>
